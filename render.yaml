# Render blueprint for the API (alternative: Vultr). Set secrets in the Render dashboard.
services:
  - type: web
    name: biohacks26-api
    runtime: python
    # Same metro as the Supabase database (AWS us-east-1); can't be changed after creation
    region: virginia
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_REFINE_MODEL
        value: gemini-3.5-flash-lite
      - key: WEB_ORIGIN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
